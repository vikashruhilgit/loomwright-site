<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 448" width="1400" height="448" role="img" aria-labelledby="mgT mgD" font-family="'Azeret Mono',ui-monospace,Menlo,monospace">
  <title id="mgT">The seven-condition fail-closed trusted auto-merge gate</title>
  <desc id="mgD">Auto-merge is opt-in and off by default. When enabled, all seven conditions must hold: the owned review drain returned READY and did not terminate under the severity floor; the head SHA is unchanged and the base is main; review decision is not blocking and no human review thread is unresolved; the branch has enforceable protection; required checks are green and the rubric is satisfied; classify-risk.sh re-classifies the PR head and parks any high-risk or unclassifiable diff with no override; rules-gate-verdict.sh parks a failing, unresolved, unstamped, or unreadable stamped gate-countable must-rule check, with no override. Any false or unreadable condition parks the pull request and notifies instead of merging.</desc>
  <style>
    .hd{font-size:12px;letter-spacing:.20em;fill:#6B6154}
    .n{font-size:10.5px;letter-spacing:.18em;fill:#E8893A}
    .t{font-size:13.5px;font-weight:600;fill:#2C2418}
    .s{font-size:11px;fill:#6B6154}
    .box{fill:#FFF8EE;stroke:rgba(44,36,24,.12)}
    .m{font-size:11px;letter-spacing:.06em}
  </style>
  <rect id="bg" x="0" y="0" width="1400" height="448" fill="#F6EFE4"/>

  <text class="hd" x="36" y="34">TRUSTED AUTO-MERGE GATE · /automate --auto-merge · OPT-IN, DEFAULT OFF</text>
  <text class="hd" x="1364" y="34" text-anchor="end" fill="#E24B6A">FAILS CLOSED</text>
  <line x1="36" y1="48" x2="1364" y2="48" stroke="rgba(44,36,24,.12)"/>

  <g>
    <rect class="box" x="36" y="86" width="176" height="168" rx="2"/><rect x="36" y="86" width="176" height="3" fill="#E8893A"/>
    <text class="n" x="50" y="112">CONDITION 01</text>
    <text class="t" x="50" y="138">Drain says READY</text>
    <text class="s" x="50" y="164">The owned review-and-heal</text>
    <text class="s" x="50" y="182">loop converged — not</text>
    <text class="s" x="50" y="200">ESCALATED, and not under</text>
    <text class="s" x="50" y="218">the severity floor.</text>
  </g>
  <g>
    <rect class="box" x="228" y="86" width="176" height="168" rx="2"/><rect x="228" y="86" width="176" height="3" fill="#E8C547"/>
    <text class="n" x="242" y="112" fill="#E8C547">CONDITION 02</text>
    <text class="t" x="242" y="138">Nothing moved</text>
    <text class="s" x="242" y="164">Head SHA still equals the</text>
    <text class="s" x="242" y="182">reviewed SHA, and the base</text>
    <text class="s" x="242" y="200">is still main. A new commit</text>
    <text class="s" x="242" y="218">invalidates approval.</text>
  </g>
  <g>
    <rect class="box" x="420" y="86" width="176" height="168" rx="2"/><rect x="420" y="86" width="176" height="3" fill="#C8E05C"/>
    <text class="n" x="434" y="112" fill="#C8E05C">CONDITION 03</text>
    <text class="t" x="434" y="138">Humans are done</text>
    <text class="s" x="434" y="164">Review decision is not</text>
    <text class="s" x="434" y="182">blocking, and no unresolved</text>
    <text class="s" x="434" y="200">human-authored thread. Bot</text>
    <text class="s" x="434" y="218">threads do not block.</text>
  </g>
  <g>
    <rect class="box" x="612" y="86" width="176" height="168" rx="2"/><rect x="612" y="86" width="176" height="3" fill="#3DCFC0"/>
    <text class="n" x="626" y="112" fill="#3DCFC0">CONDITION 04</text>
    <text class="t" x="626" y="138">The branch is real</text>
    <text class="s" x="626" y="164">Enforceable protection: an</text>
    <text class="s" x="626" y="182">approving review or a</text>
    <text class="s" x="626" y="200">required check. Toothless</text>
    <text class="s" x="626" y="218">protection counts as none.</text>
  </g>
  <g>
    <rect class="box" x="804" y="86" width="176" height="168" rx="2"/><rect x="804" y="86" width="176" height="3" fill="#6B8CFF"/>
    <text class="n" x="818" y="112" fill="#6B8CFF">CONDITION 05</text>
    <text class="t" x="818" y="138">Proof is green</text>
    <text class="s" x="818" y="164">Required checks all green,</text>
    <text class="s" x="818" y="182">and the Phase 4.5 rubric</text>
    <text class="s" x="818" y="200">satisfied. An item with no</text>
    <text class="s" x="818" y="218">rubric counts as N/A.</text>
  </g>
  <g>
    <rect class="box" x="996" y="86" width="176" height="168" rx="2"/><rect x="996" y="86" width="176" height="3" fill="#7A5AE0"/>
    <text class="n" x="1010" y="112" fill="#7A5AE0">CONDITION 06</text>
    <text class="t" x="1010" y="138">Not high-risk</text>
    <text class="s" x="1010" y="164">classify-risk.sh re-reads</text>
    <text class="s" x="1010" y="182">the PR head. High-risk or</text>
    <text class="s" x="1010" y="200">unclassifiable parks.</text>
    <text class="s" x="1010" y="218">No override.</text>
  </g>
  <g>
    <rect class="box" x="1188" y="86" width="176" height="168" rx="2"/><rect x="1188" y="86" width="176" height="3" fill="#D63D5C"/>
    <text class="n" x="1202" y="112" fill="#D63D5C">CONDITION 07</text>
    <text class="t" x="1202" y="138">Rules hold</text>
    <text class="s" x="1202" y="164">rules-gate-verdict.sh</text>
    <text class="s" x="1202" y="182">Failing, unresolved,</text>
    <text class="s" x="1202" y="200">unstamped, or unreadable</text>
    <text class="s" x="1202" y="218">must-rule check parks.</text>
    <text class="s" x="1202" y="236">No override.</text>
  </g>

  <!-- evaluation bus -->
  <g stroke="rgba(240,230,212,.28)" stroke-width="1.5" fill="none">
    <path d="M124 254 V 298"/><path d="M316 254 V 298"/><path d="M508 254 V 298"/><path d="M700 254 V 298"/><path d="M892 254 V 298"/><path d="M1084 254 V 298"/><path d="M1276 254 V 298"/>
  </g>
  <rect x="100" y="298" width="1200" height="26" fill="#F3E6D4" stroke="rgba(240,230,212,.14)"/>
  <text class="m" x="700" y="315" text-anchor="middle" fill="#6B6154" letter-spacing=".16em">GATE-EVAL · ONE IMPLEMENTATION · UNREADABLE IS TREATED AS FALSE</text>

  <path d="M124 324 V 358" stroke="#E24B6A" stroke-width="1.5" fill="none"/>
  <path d="M124 366 l -5 -10 h10 z" fill="#E24B6A"/>
  <path d="M1276 324 V 358" stroke="#C8E05C" stroke-width="1.5" fill="none"/>
  <path d="M1276 366 l -5 -10 h10 z" fill="#C8E05C"/>

  <rect x="36" y="366" width="640" height="68" fill="#FFF8EE" stroke="rgba(226,75,106,.4)"/>
  <rect x="36" y="366" width="5" height="68" fill="#E24B6A"/>
  <text class="t" x="58" y="396" fill="#E24B6A">ANY ONE FAILS → PARK + notify</text>
  <text class="s" x="58" y="420">The PR stays open, the queue stops, and it waits for you.</text>

  <rect x="724" y="366" width="640" height="68" fill="#FFF8EE" stroke="rgba(200,224,92,.4)"/>
  <rect x="724" y="366" width="5" height="68" fill="#C8E05C"/>
  <text class="t" x="746" y="396" fill="#C8E05C">ALL SEVEN HOLD → gh pr merge --squash</text>
  <text class="s" x="746" y="420">The only place in the whole mill allowed to run a merge command.</text>
</svg>
