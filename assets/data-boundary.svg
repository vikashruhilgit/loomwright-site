<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 448" width="1200" height="448" role="img" aria-labelledby="dbT dbD" font-family="'Azeret Mono',ui-monospace,Menlo,monospace">
  <title id="dbT">What stays on your machine and what crosses the boundary</title>
  <desc id="dbD">Session logs, supervisor state, project memory and Twin stores, the insights dashboard, the Obsidian vault, and the local observability stack all stay on your machine. What crosses: branches, commits and pull requests to your own git remote, and prompts to Claude exactly as in any Claude Code session. Opt-in only: GitHub-issue telemetry, gate webhooks to a URL you set, and version-controlling memory stores behind a consent step.</desc>
  <style>
    .hd{font-size:12px;letter-spacing:.20em;fill:#6B6154}
    .zone{font-size:13px;letter-spacing:.18em;fill:#C8E05C}
    .ct{font-size:11.5px;fill:#2C2418}
    .cs{font-size:10.5px;fill:#6B6154}
    .chip{fill:#F3E6D4;stroke:rgba(44,36,24,.12)}
    .out{font-size:12.5px;font-weight:600;fill:#2C2418}
    .tag{font-size:10px;letter-spacing:.14em}
  </style>
  <rect id="bg" x="0" y="0" width="1200" height="448" fill="#F6EFE4"/>

  <text class="hd" x="32" y="32">WHAT LEAVES · AND WHAT NEVER DOES</text>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="rgba(44,36,24,.12)"/>

  <rect x="32" y="66" width="640" height="362" fill="rgba(200,224,92,.03)" stroke="#C8E05C" stroke-dasharray="6 6" stroke-opacity=".5"/>
  <text class="zone" x="52" y="94">YOUR MACHINE · YOUR REPO</text>

  <g>
    <rect class="chip" x="52" y="110" width="290" height="64"/><text class="ct" x="70" y="136">Session logs &amp; .supervisor/</text><text class="cs" x="70" y="156">Every run, decision, and worker result.</text>
    <rect class="chip" x="362" y="110" width="290" height="64"/><text class="ct" x="380" y="136">Project memory &amp; System Twin</text><text class="cs" x="380" y="156">Contracts, provenance, blast radius.</text>
    <rect class="chip" x="52" y="186" width="290" height="64"/><text class="ct" x="70" y="212">/insights dashboard</text><text class="cs" x="70" y="232">Heal rate and trend, rendered locally.</text>
    <rect class="chip" x="362" y="186" width="290" height="64"/><text class="ct" x="380" y="212">/obsidian vault</text><text class="cs" x="380" y="232">One-way projection you own.</text>
    <rect class="chip" x="52" y="262" width="600" height="78"/><text class="ct" x="70" y="288">Observability: Langfuse + OTel collector in Docker, on this machine</text><text class="cs" x="70" y="308">The plugin emits no spans of its own. It points Claude Code's native</text><text class="cs" x="70" y="326">OpenTelemetry at a collector running on this machine.</text>
    <rect class="chip" x="52" y="348" width="600" height="60"/><text class="ct" x="70" y="374">/dreaming, /handoff, /pr-postmortem, /rules</text><text class="cs" x="70" y="394">Read your own history. Nothing is uploaded to run them.</text>
  </g>

  <g stroke="rgba(44,36,24,.22)" stroke-width="1.5" fill="none">
    <path d="M672 130 H 796"/><path d="M672 232 H 796"/><path d="M672 336 H 796"/>
  </g>
  <g fill="rgba(44,36,24,.4)">
    <path d="M796 130 l -10 -5 v10 z"/><path d="M796 232 l -10 -5 v10 z"/><path d="M796 336 l -10 -5 v10 z"/>
  </g>

  <rect x="804" y="94" width="364" height="72" fill="#FFF8EE" stroke="rgba(107,140,255,.35)"/>
  <rect x="804" y="94" width="4" height="72" fill="#6B8CFF"/>
  <text class="tag" x="824" y="118" fill="#6B8CFF">DEFAULT · THIS IS JUST GIT</text>
  <text class="out" x="824" y="140">Your git remote</text>
  <text class="cs" x="824" y="158">Branches, commits, and pull requests via gh.</text>

  <rect x="804" y="196" width="364" height="72" fill="#FFF8EE" stroke="rgba(107,140,255,.35)"/>
  <rect x="804" y="196" width="4" height="72" fill="#6B8CFF"/>
  <text class="tag" x="824" y="220" fill="#6B8CFF">DEFAULT · SAME AS ANY SESSION</text>
  <text class="out" x="824" y="242">Claude</text>
  <text class="cs" x="824" y="260">The prompts Claude Code would send anyway.</text>

  <rect x="804" y="298" width="364" height="100" fill="#FFF8EE" stroke="rgba(232,197,71,.35)"/>
  <rect x="804" y="298" width="4" height="100" fill="#E8C547"/>
  <text class="tag" x="824" y="322" fill="#E8C547">OPT-IN · OFF UNTIL YOU SAY YES</text>
  <text class="out" x="824" y="344">Three, and only three</text>
  <text class="cs" x="824" y="362">GitHub-issue telemetry, behind /telemetry consent.</text>
  <text class="cs" x="824" y="378">Gate webhooks, only to a URL you set yourself.</text>
  <text class="cs" x="824" y="394">Committing memory stores, behind a named consent step.</text>
</svg>
